<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" role="img" aria-label="First Principles Algorithm flow diagram">
  <defs>
    <linearGradient id="g0" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="960" height="720" fill="#f8fafc"/>
  <rect x="24" y="24" width="912" height="672" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>

  <!-- title -->
  <text x="480" y="68" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#0f172a">First Principles Algorithm</text>
  <text x="480" y="96" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" fill="#64748b">Question → Delete → Simplify → Accelerate → Automate last</text>

  <!-- Layer 0: First principles -->
  <rect x="120" y="120" width="720" height="72" rx="12" fill="url(#g0)" filter="url(#shadow)"/>
  <text x="480" y="150" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18" font-weight="700" fill="#ffffff">0 · First principles layer</text>
  <text x="480" y="174" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" fill="#ccfbf1">Hard constraints vs analogy · Idiot Index · materials / primitives</text>

  <!-- arrow down from 0 -->
  <line x1="480" y1="192" x2="480" y2="228" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Steps 1-5 as vertical stack -->
  <!-- Step 1 -->
  <rect x="140" y="232" width="540" height="58" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="180" cy="261" r="18" fill="#3b82f6"/>
  <text x="180" y="267" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ffffff">1</text>
  <text x="216" y="255" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#1e3a8a">Question requirements</text>
  <text x="216" y="276" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#475569">Make requirements less dumb · named owner for every requirement</text>

  <line x1="480" y1="290" x2="480" y2="318" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <rect x="140" y="322" width="540" height="58" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="180" cy="351" r="18" fill="#ef4444"/>
  <text x="180" y="357" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ffffff">2</text>
  <text x="216" y="345" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#7f1d1d">Delete</text>
  <text x="216" y="366" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#475569">Parts · steps · features · meetings · layers — delete a bit too much</text>

  <line x1="480" y1="380" x2="480" y2="408" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <rect x="140" y="412" width="540" height="58" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="180" cy="441" r="18" fill="#22c55e"/>
  <text x="180" y="447" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ffffff">3</text>
  <text x="216" y="435" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#14532d">Simplify / optimize</text>
  <text x="216" y="456" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#475569">Only what survived deletion — never optimize what should not exist</text>

  <line x1="480" y1="470" x2="480" y2="498" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <rect x="140" y="502" width="540" height="58" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="180" cy="531" r="18" fill="#f97316"/>
  <text x="180" y="537" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ffffff">4</text>
  <text x="216" y="525" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#7c2d12">Accelerate cycle time</text>
  <text x="216" y="546" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#475569">Shorten build → test → learn — do not accelerate a wasteful process</text>

  <line x1="480" y1="560" x2="480" y2="588" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 5 -->
  <rect x="140" y="592" width="540" height="58" rx="10" fill="url(#g5)" filter="url(#shadow)"/>
  <circle cx="180" cy="621" r="18" fill="#ffffff" fill-opacity="0.25" stroke="#ffffff" stroke-width="2"/>
  <text x="180" y="627" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ffffff">5</text>
  <text x="216" y="615" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Automate last</text>
  <text x="216" y="636" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" fill="#fff7ed">Only when 1–4 are stable — early automation locks in waste</text>

  <!-- callout note on the right of step 2 -->
  <rect x="720" y="310" width="200" height="82" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/>
  <text x="820" y="338" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#854d0e">~10% add-back</text>
  <text x="820" y="358" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#713f12">means you deleted</text>
  <text x="820" y="376" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="11" fill="#713f12">enough</text>

  <!-- small connector from step 2 box to callout -->
  <line x1="680" y1="351" x2="720" y2="351" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- footer order note -->
  <text x="480" y="678" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#64748b">Never skip or reorder steps 1→5 · Do not optimize or automate first</text>
</svg>
